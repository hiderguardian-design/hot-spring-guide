<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixCollect — AI 作品集</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
* { font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }

body { background: #f7f7f8; color: #18181b; }

/* 瀑布流 */
.masonry { columns: 2; column-gap: 16px; }
@media (min-width: 1024px) { .masonry { columns: 3; } }
@media (min-width: 1536px) { .masonry { columns: 4; } }
.masonry > * { break-inside: avoid; margin-bottom: 16px; }

/* 卡片 */
.card {
  border-radius: 18px;
  overflow: hidden;
  background: #fff;
  border: 1px solid #ececee;
  transition: transform .3s cubic-bezier(.4,0,.2,1), box-shadow .3s;
  cursor: pointer;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 18px 40px -18px rgba(20,20,30,.18);
}
.card-media { position: relative; overflow: hidden; background:#f1f1f3; }
.card-media img { width:100%; display:block; transition: transform .5s ease; }
.card:hover .card-media img { transform: scale(1.04); }

/* 分区 tab */
.tab {
  padding: 7px 16px;
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 500;
  color: #52525b;
  transition: all .2s;
  white-space: nowrap;
  cursor: pointer;
}
.tab:hover { background: #fff; color: #18181b; }
.tab.active {
  background: #18181b;
  color: #fff;
  box-shadow: 0 6px 16px -6px rgba(24,24,27,.35);
}

/* 主按钮 */
.btn-primary {
  background: #18181b;
  color: #fff;
  transition: all .25s;
}
.btn-primary:hover { background: linear-gradient(135deg,#6366f1,#a855f7); }

/* 音乐频谱 */
@keyframes eq { 0%,100%{height:28%;} 50%{height:100%;} }
.eq-bar { width:4px; border-radius:2px; background:linear-gradient(to top,#6366f1,#a855f7); animation: eq 1.1s ease-in-out infinite; }

/* 标签 */
.tag { font-size:12px; padding:3px 10px; border-radius:9999px; background:#f4f4f5; color:#71717a; }
.heart { color:#e11d48; }

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#a1a1aa}
</style>
</head>

<body class="min-h-screen">

<!-- 顶部栏 -->
<header class="sticky top-0 z-40 bg-white/80 backdrop-blur-xl border-b border-black/5">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">

    <!-- Logo -->
    <div class="flex items-center gap-2.5 shrink-0">
      <svg viewBox="0 0 40 40" class="w-9 h-9">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#lg)"/>
        <path d="M20 9 C21.4 13.8, 24.2 16.6, 29 18 C24.2 19.4, 21.4 22.2, 20 27 C18.6 22.2, 15.8 19.4, 11 18 C15.8 16.6, 18.6 13.8, 20 9 Z" fill="#fff"/>
      </svg>
      <div class="leading-tight">
        <div class="font-bold text-[17px] tracking-tight">PixCollect</div>
        <div class="text-[10px] tracking-[0.18em] text-zinc-400 uppercase -mt-0.5">AI Works</div>
      </div>
    </div>

    <!-- 搜索 -->
    <div class="flex-1 max-w-md mx-auto hidden md:block">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 text-sm"></i>
        <input id="search-input" onkeyup="if(event.key==='Enter') doSearch()"
               placeholder="搜索作品、模型、创作者"
               class="w-full bg-zinc-100 border border-transparent rounded-full py-2.5 pl-11 pr-4 text-sm text-zinc-800 placeholder-zinc-400 focus:outline-none focus:bg-white focus:border-zinc-300 focus:ring-4 focus:ring-zinc-100 transition"/>
      </div>
    </div>

    <!-- 右侧 -->
    <div class="flex items-center gap-2.5 shrink-0 ml-auto md:ml-0">
      <button onclick="showUploadModal()" class="btn-primary hidden sm:flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-semibold">
        <i class="fa-solid fa-plus"></i> 发布作品
      </button>
      <button onclick="showUploadModal()" class="btn-primary sm:hidden w-10 h-10 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-plus"></i>
      </button>
      <div class="w-9 h-9 rounded-full overflow-hidden ring-1 ring-black/10">
        <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=80&h=80&fit=crop" class="w-full h-full object-cover">
      </div>
    </div>
  </div>

  <!-- 分区 Tab -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 pb-3 flex gap-2 overflow-x-auto no-scrollbar">
    <button class="tab active" onclick="switchCat('all', this)">全部</button>
    <button class="tab" onclick="switchCat('image', this)">图像</button>
    <button class="tab" onclick="switchCat('video', this)">视频</button>
    <button class="tab" onclick="switchCat('music', this)">音乐</button>
    <button class="tab" onclick="switchCat('novel', this)">小说</button>
    <button class="tab" onclick="switchCat('3d', this)">3D</button>
    <button class="tab" onclick="switchCat('code', this)">代码</button>
  </div>
</header>

<!-- 主内容 -->
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-7">

  <!-- 顶部欢迎 -->
  <section class="mb-7">
    <h1 class="text-[28px] sm:text-[34px] font-extrabold tracking-tight leading-tight">
      发现 AI 创造力
    </h1>
    <p class="text-zinc-500 text-[15px] mt-1">图像 · 视频 · 音乐 · 小说，所有 AI 作品都在这儿</p>
  </section>

  <!-- 瀑布流 -->
  <div id="feed" class="masonry"></div>

  <footer class="mt-12 pb-10 text-center text-xs text-zinc-400">
    PixCollect · 开源原型
  </footer>
</main>

<!-- 上传弹窗 -->
<div id="upload-modal" onclick="if(event.target===this) hideUploadModal()"
     class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-3xl p-8 animate-[pop_.3s_ease]">
    <div class="flex items-center justify-between mb-7">
      <h3 class="text-xl font-bold">发布你的 AI 作品</h3>
      <button onclick="hideUploadModal()" class="w-9 h-9 rounded-full bg-zinc-100 hover:bg-zinc-200 flex items-center justify-center">
        <i class="fa-solid fa-xmark text-zinc-500"></i>
      </button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <button onclick="chooseType('image')" class="group h-28 rounded-2xl border-2 border-dashed border-zinc-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex flex-col items-center justify-center gap-2">
        <i class="fa-regular fa-image text-3xl text-indigo-500 group-hover:scale-110 transition"></i>
        <span class="text-sm font-medium">图像</span>
      </button>
      <button onclick="chooseType('video')" class="group h-28 rounded-2xl border-2 border-dashed border-zinc-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex flex-col items-center justify-center gap-2">
        <i class="fa-solid fa-clapperboard text-3xl text-indigo-500 group-hover:scale-110 transition"></i>
        <span class="text-sm font-medium">视频</span>
      </button>
      <button onclick="chooseType('music')" class="group h-28 rounded-2xl border-2 border-dashed border-zinc-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex flex-col items-center justify-center gap-2">
        <i class="fa-solid fa-music text-3xl text-indigo-500 group-hover:scale-110 transition"></i>
        <span class="text-sm font-medium">音乐</span>
      </button>
      <button onclick="chooseType('novel')" class="group h-28 rounded-2xl border-2 border-dashed border-zinc-200 hover:border-indigo-400 hover:bg-indigo-50/50 transition flex flex-col items-center justify-center gap-2">
        <i class="fa-solid fa-book-open text-3xl text-indigo-500 group-hover:scale-110 transition"></i>
        <span class="text-sm font-medium">小说</span>
      </button>
    </div>
  </div>
</div>

<style>@keyframes pop { from { opacity:0; transform: scale(.94) translateY(8px);} to { opacity:1; transform: scale(1) translateY(0);} }
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}</style>

<script>
let currentCat = 'all';

const products = [
  { id:1, cat:'image', title:'橘猫的午后', creator:'PixCat', model:'Flux.1', likes:1247, comments:86,
    media:{ type:'img', src:'https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=700&q=80&auto=format&fit=crop', h:0, ratio:'3/4' } },
  { id:2, cat:'image', title:'霓虹雨夜', creator:'NeonArt', model:'SDXL', likes:982, comments:54,
    media:{ type:'img', src:'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=700&q=80&auto=format&fit=crop', h:0, ratio:'4/3' } },
  { id:3, cat:'image', title:'窗边的小猫', creator:'CyberMeow', model:'Flux.1', likes:1560, comments:132,
    media:{ type:'img', src:'https://images.unsplash.com/photo-1543857778-c4a1a3e0b2eb?w=700&q=80&auto=format&fit=crop', h:0, ratio:'4/5' } },
  { id:4, cat:'video', title:'海浪循环', creator:'FlowStudio', model:'Runway', likes:734, comments:29,
    media:{ type:'video', poster:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700&q=80&auto=format&fit=crop', src:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', ratio:'16/10' } },
  { id:5, cat:'music', title:'Lo-fi 深夜自习室', creator:'JAZZAI', model:'Suno v4', likes:654, comments:38,
    media:{ type:'music' } },
  { id:6, cat:'image', title:'林间晨雾', creator:'ForestAI', model:'Midjourney', likes:1103, comments:47,
    media:{ type:'img', src:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700&q=80&auto=format&fit=crop', h:0, ratio:'3/4' } },
  { id:7, cat:'novel', title:'像素猫的冒险日记', creator:'StoryAI', model:'Grok-4', likes:423, comments:67,
    media:{ type:'novel' } },
  { id:8, cat:'image', title:'雪地里的猫', creator:'WinterArt', model:'SD 3.5', likes:876, comments:33,
    media:{ type:'img', src:'https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=700&q=80&auto=format&fit=crop', h:0, ratio:'4/3' } },
  { id:9, cat:'code', title:'终端美化脚本', creator:'DevBot', model:'GPT-5', likes:199, comments:18,
    media:{ type:'code' } },
  { id:10, cat:'3d', title:'低多边形小岛', creator:'PolyArt', model:'Meshy', likes:287, comments:12,
    media:{ type:'img', src:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=700&q=80&auto=format&fit=crop', h:0, ratio:'16/11' } },
  { id:11, cat:'music', title:'清晨电子脉冲', creator:'WaveGen', model:'Udio 1.5', likes:521, comments:22,
    media:{ type:'music' } },
];

const typeLabel = { image:'图像', video:'视频', music:'音乐', novel:'小说', '3d':'3D', code:'代码' };

function cardHTML(p) {
  const m = p.media;
  let mediaHTML = '';

  if (m.type === 'img') {
    mediaHTML = `<img src="${m.src}" alt="${p.title}" loading="lazy" style="aspect-ratio:${m.ratio}">`;
  } else if (m.type === 'video') {
    mediaHTML = `
      <div class="relative" style="aspect-ratio:${m.ratio}">
        <img src="${m.poster}" alt="${p.title}" loading="lazy" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/25 flex items-center justify-center">
          <div class="w-12 h-12 rounded-full bg-white/90 flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-play text-zinc-900 ml-0.5"></i>
          </div>
        </div>
        <span class="absolute bottom-2.5 right-2.5 bg-white/90 text-[11px] px-2 py-0.5 rounded-full font-medium text-zinc-700">${p.model}</span>
      </div>`;
  } else if (m.type === 'music') {
    const bars = Array.from({length: 18}, (_,i) =>
      `<div class="eq-bar" style="animation-delay:${i*0.08}s"></div>`).join('');
    mediaHTML = `
      <div class="flex flex-col items-center justify-center gap-6 py-12" style="background:linear-gradient(150deg,#eef2ff,#faf5ff);">
        <div class="w-16 h-16 rounded-2xl bg-white shadow-sm flex items-center justify-center">
          <i class="fa-solid fa-music text-2xl text-indigo-500"></i>
        </div>
        <div class="flex items-end gap-1 h-12">${bars}</div>
        <div class="text-[11px] text-zinc-400 font-medium">${p.model} · 点击试听</div>
      </div>`;
  } else if (m.type === 'novel') {
    mediaHTML = `
      <div class="flex flex-col px-6 py-8" style="background:linear-gradient(150deg,#fffbeb,#fdf2f8);">
        <div class="text-[10px] tracking-[0.22em] text-amber-600/70 mb-3 font-semibold">AI 小说 · ${p.model}</div>
        <div class="text-[17px] font-bold leading-snug mb-2.5">${p.title}</div>
        <div class="text-[12.5px] text-zinc-500 leading-relaxed line-clamp-4">第一章：清晨的第一缕阳光穿过像素森林，一只戴着围巾的小猫踏上旅途。它要去寻找传说中会发光的星星…</div>
        <div class="flex gap-2 mt-4">
          <span class="tag"># 冒险</span><span class="tag"># 治愈</span>
        </div>
      </div>`;
  } else if (m.type === 'code') {
    mediaHTML = `
      <div class="flex flex-col px-5 py-6" style="background:#0d1117;">
        <div class="flex items-center gap-1.5 mb-4">
          <span class="w-2.5 h-2.5 rounded-full bg-red-400"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-yellow-400"></span>
          <span class="w-2.5 h-2.5 rounded-full bg-green-400"></span>
        </div>
        <pre class="text-[11.5px] leading-relaxed text-emerald-300 overflow-hidden"><code>def hello_ai():
    print("你好，AI 作品！")
    return "✨"</code></pre>
      </div>`;
  }

  return `
    <div class="card" onclick="openDetail(${p.id})">
      <div class="card-media">${mediaHTML}</div>
      <div class="p-4">
        <div class="font-semibold text-[15px] leading-snug mb-2.5">${p.title}</div>
        <div class="flex items-center justify-between text-[12.5px] text-zinc-400">
          <div class="flex items-center gap-1.5 min-w-0">
            <div class="w-5 h-5 rounded-full bg-zinc-200 flex items-center justify-center text-[9px] font-bold text-zinc-500 shrink-0">${p.creator[0]}</div>
            <span class="truncate">${p.creator}</span>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            <span class="flex items-center gap-1"><i class="fa-solid fa-heart heart text-[12px]"></i>${p.likes>=1000 ? (p.likes/1000).toFixed(1)+'k' : p.likes}</span>
            <span class="text-zinc-300">${typeLabel[p.cat]}</span>
          </div>
        </div>
      </div>
    </div>`;
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const list = currentCat === 'all' ? products : products.filter(p => p.cat === currentCat);
  feed.innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="col-span-full text-center text-zinc-400 py-24">
         <i class="fa-regular fa-folder-open text-4xl mb-4 block"></i>
         该分区还没有作品
       </div>`;
}

function switchCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  renderFeed();
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const feed = document.getElementById('feed');
  if (!q) return renderFeed();
  const list = products.filter(p =>
    p.title.toLowerCase().includes(q) || p.creator.toLowerCase().includes(q) || p.model.toLowerCase().includes(q));
  feed.innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="col-span-full text-center text-zinc-400 py-24">没有找到「${q}」相关作品</div>`;
}

function openDetail(id) {
  const p = products.find(x => x.id === id);
  alert(`「${p.title}」\n\n创作者：${p.creator}\n模型：${p.model}\n❤️ ${p.likes} 赞\n\n（详情页待接入）`);
}

function showUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
function hideUploadModal()  { document.getElementById('upload-modal').classList.add('hidden'); }
function chooseType(t) {
  hideUploadModal();
  alert(`已选择「${t}」类型\n\n接下来可接入真实上传 / 发布`);
}

window.onload = renderFeed;
</script>
</body>
</html>
