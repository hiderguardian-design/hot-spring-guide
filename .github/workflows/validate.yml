name: validate-data

on:
  push:
    paths: ['data/**', 'scripts/**']
  pull_request:
    paths: ['data/**', 'scripts/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 校验温泉数据
        run: node scripts/validate.js data/regions-gd.json
      - name: 静态文件烟雾检查
        run: node scripts/smoke-test.js
      - name: 纯函数单元测试
        run: node scripts/unit-test.js
